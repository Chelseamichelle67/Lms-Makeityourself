<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Make It Yourself</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        wine: {
                            50: '#fcf2f4',
                            100: '#f8e4e7',
                            200: '#f1c8ce',
                            300: '#e5a1ab',
                            500: '#a3283c',
                            700: '#721422',
                            900: '#520e18'
                        },
                        blush: {
                            100: '#fbe9eb',
                            200: '#f5d5d8',
                            500: '#e08a95',
                            600: '#cc6a77'
                        },
                        gold: {
                            400: '#facc15',
                            500: '#eab308'
                        }
                    },
                    fontFamily: {
                        sans: ['Montserrat', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                        handwriting: ['Caveat', 'cursive']
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Montserrat:wght@300;400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #fcf2f4;
            color: #2d1519;
            overflow-x: hidden;
        }
        .custom-gradient {
            background: linear-gradient(135deg, #721422 0%, #a3283c 50%, #520e18 100%);
        }
    </style>
</head>
<body class="bg-wine-50 min-h-screen flex flex-col justify-between selection:bg-wine-500 selection:text-white">

    <!-- Header / Navbar simplificado -->
    <header class="w-full bg-white/90 backdrop-blur-md border-b border-wine-100 shadow-sm py-4 px-6 sm:px-12 flex items-center justify-between">
        <a href="index.html" class="flex flex-col group text-left">
            <span class="text-[10px] sm:text-xs font-semibold tracking-widest text-wine-500 uppercase">Make It</span>
            <span class="text-xl sm:text-2xl font-bold tracking-tight text-wine-700 font-serif -mt-1 group-hover:text-wine-900 transition-colors">YOURSELF</span>
        </a>
        <a href="index.html" class="text-sm font-semibold text-wine-700 hover:text-wine-900 flex items-center gap-2 transition-colors">
            <i class="fa-solid fa-arrow-left text-xs"></i> Volver al Inicio
        </a>
    </header>

    <!-- Contenido Principal: Formulario de Login -->
    <main class="flex-grow flex items-center justify-center px-4 sm:px-6 py-12">
        <div class="max-w-md w-full bg-white rounded-3xl p-8 sm:p-10 shadow-xl border border-wine-100 relative">
            <div class="text-center mb-8">
                <span class="bg-wine-100 text-wine-700 text-xs font-bold uppercase px-3 py-1 rounded-full">Bienvenida de nuevo</span>
                <h1 class="text-3xl font-bold text-wine-900 font-serif mt-3">Iniciar Sesión</h1>
                <p class="text-xs sm:text-sm text-gray-600 mt-1">Accede a tus cursos y continúa aprendiendo.</p>
            </div>

            <!-- Alerta de Error Global -->
            <div id="error-alert" class="hidden mb-6 p-4 bg-red-50 border border-red-200 text-red-700 rounded-xl text-xs sm:text-sm font-medium"></div>

            <form id="login-form" class="space-y-4" novalidate>
                <div>
                    <label for="email" class="block text-xs font-semibold text-gray-700 mb-1">Correo Electrónico</label>
                    <input type="email" id="email" name="email" placeholder="tucorreo@email.com" required 
                           class="w-full px-4 py-3 rounded-xl border border-gray-300 text-sm focus:outline-none focus:border-wine-700 focus:ring-1 focus:ring-wine-700 transition-all">
                </div>
                <div>
                    <label for="password" class="block text-xs font-semibold text-gray-700 mb-1">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required 
                           class="w-full px-4 py-3 rounded-xl border border-gray-300 text-sm focus:outline-none focus:border-wine-700 focus:ring-1 focus:ring-wine-700 transition-all">
                </div>

                <button type="submit" id="btn-submit" class="w-full py-3.5 rounded-xl text-white font-bold text-sm custom-gradient shadow-lg hover:opacity-95 transform hover:-translate-y-0.5 transition-all flex items-center justify-center gap-2">
                    <span id="btn-text">Ingresar</span>
                    <i id="btn-spinner" class="fa-solid fa-spinner fa-spin hidden"></i>
                </button>
            </form>

            <!-- Botón de acceso con Google -->
            <div class="mt-4">
                <button type="button" id="btn-google" class="w-full py-3 px-4 rounded-xl border border-gray-300 bg-white text-gray-700 font-semibold text-sm hover:bg-gray-50 transition-all flex items-center justify-center gap-3 shadow-sm">
                    <i class="fa-brands fa-google text-red-500 text-base"></i> Continuar con Google
                </button>
            </div>

            <div class="mt-6 text-center text-xs sm:text-sm text-gray-600">
                ¿Aún no tienes cuenta? 
                <a href="registro.html" class="font-bold text-wine-700 hover:underline">Regístrate gratis</a>
            </div>
        </div>
    </main>

    <!-- Footer simple -->
    <footer class="w-full py-6 text-center text-xs text-gray-500 border-t border-wine-100">
        &copy; 2026 Make It Yourself. Todos los derechos reservados.
    </footer>

    <!-- Script de Login conectado con Firebase -->
    <script type="module" src="js/login.js"></script>
</body>
</html>
